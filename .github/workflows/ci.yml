name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, types, unit tests, build, simulation smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # a real Redis, so the quota store's atomic Lua scripts run in tests (tests/unit/ai-store.test.ts, ai-app.test.ts)
      - run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends redis-server && sudo systemctl stop redis-server || true
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
        env:
          BE_REQUIRE_REDIS: '1'
      - run: npm run build
      - run: npm run size
      - run: npx playwright install --with-deps chromium
      - run: npm run verify:hosting
      # eight policies x four scenario families x eight paired seeds; exits non-zero on a crash, softlock, nondeterminism or an engine violation
      - run: npm run test:sim:smoke

  e2e:
    name: Browser tests (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npx playwright install --with-deps firefox webkit
      - run: npm run test:e2e:browsers
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results
          retention-days: 7
